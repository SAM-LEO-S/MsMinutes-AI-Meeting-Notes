openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API for the Ms.Minutes meeting transcription and intelligence workspace
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: meetings
    description: Meeting transcription, review, history, and exports
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /meetings:
    get:
      operationId: listMeetings
      tags: [meetings]
      summary: List meeting history
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Meeting history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MeetingSummary"
    post:
      operationId: createMeeting
      tags: [meetings]
      summary: Save a reviewed meeting
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MeetingInput"
      responses:
        "201":
          description: Saved meeting
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Meeting"
  /meetings/process:
    post:
      operationId: processMeeting
      tags: [meetings]
      summary: Transcribe and analyze meeting audio
      description: Accepts one audio file and streams genuine processing-stage events followed by a completed meeting result.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/MeetingProcessInput"
      responses:
        "200":
          description: Server-sent progress events, ending with a complete or error event
          content:
            text/event-stream:
              schema:
                type: string
        "400":
          description: Invalid audio input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: Gemini could not process the recording
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /meetings/{id}:
    get:
      operationId: getMeeting
      tags: [meetings]
      summary: Get a meeting and its review data
      parameters:
        - $ref: "#/components/parameters/MeetingId"
      responses:
        "200":
          description: Meeting details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Meeting"
        "404":
          description: Meeting not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    patch:
      operationId: updateMeeting
      tags: [meetings]
      summary: Update a meeting title, transcript, or intelligence
      parameters:
        - $ref: "#/components/parameters/MeetingId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MeetingUpdate"
      responses:
        "200":
          description: Updated meeting
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Meeting"
        "404":
          description: Meeting not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: deleteMeeting
      tags: [meetings]
      summary: Delete a meeting from history
      parameters:
        - $ref: "#/components/parameters/MeetingId"
      responses:
        "204":
          description: Meeting deleted
        "404":
          description: Meeting not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /meetings/{id}/export/pdf:
    get:
      operationId: exportMeetingPdf
      tags: [meetings]
      summary: Download meeting minutes as PDF
      parameters:
        - $ref: "#/components/parameters/MeetingId"
      responses:
        "200":
          description: Downloadable PDF meeting minutes
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "404":
          description: Meeting not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /meetings/{id}/export/docx:
    get:
      operationId: exportMeetingDocx
      tags: [meetings]
      summary: Download meeting minutes as Word
      parameters:
        - $ref: "#/components/parameters/MeetingId"
      responses:
        "200":
          description: Downloadable Word meeting minutes
          content:
            application/vnd.openxmlformats-officedocument.wordprocessingml.document:
              schema:
                type: string
                format: binary
        "404":
          description: Meeting not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /dashboard:
    get:
      operationId: getDashboard
      tags: [meetings]
      summary: Get meeting workspace totals and recent activity
      responses:
        "200":
          description: Meeting workspace overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeetingDashboard"
components:
  parameters:
    MeetingId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ApiError:
      type: object
      properties:
        error:
          type: string
      required: [error]
    MeetingProcessInput:
      type: object
      properties:
        audio:
          type: string
          format: binary
        title:
          type: string
          maxLength: 160
      required: [audio]
    MeetingInput:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 160
        durationSeconds:
          type: integer
          minimum: 0
        transcript:
          type: array
          items:
            $ref: "#/components/schemas/TranscriptSegment"
        intelligence:
          $ref: "#/components/schemas/MeetingIntelligence"
      required: [title, durationSeconds, transcript, intelligence]
    MeetingUpdate:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 160
        transcript:
          type: array
          items:
            $ref: "#/components/schemas/TranscriptSegment"
        intelligence:
          $ref: "#/components/schemas/MeetingIntelligence"
      minProperties: 1
    Meeting:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        createdAt:
          type: string
          format: date-time
        durationSeconds:
          type: integer
        summary:
          type: string
        transcript:
          type: array
          items:
            $ref: "#/components/schemas/TranscriptSegment"
        intelligence:
          $ref: "#/components/schemas/MeetingIntelligence"
      required: [id, title, createdAt, durationSeconds, summary, transcript, intelligence]
    MeetingSummary:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        createdAt:
          type: string
          format: date-time
        durationSeconds:
          type: integer
        summary:
          type: string
        speakerCount:
          type: integer
        actionItemCount:
          type: integer
        decisionCount:
          type: integer
        needsReview:
          type: boolean
      required: [id, title, createdAt, durationSeconds, summary, speakerCount, actionItemCount, decisionCount, needsReview]
    MeetingDashboard:
      type: object
      properties:
        totalMeetings:
          type: integer
        totalMinutes:
          type: integer
        actionItems:
          type: integer
        reviewCount:
          type: integer
        recentMeetings:
          type: array
          items:
            $ref: "#/components/schemas/MeetingSummary"
      required: [totalMeetings, totalMinutes, actionItems, reviewCount, recentMeetings]
    TranscriptSegment:
      type: object
      properties:
        speaker:
          type: string
        startTime:
          type: number
          minimum: 0
        endTime:
          type: number
          minimum: 0
        originalText:
          type: string
        translatedText:
          type: string
        language:
          type: string
          enum: [ta, en, mixed]
        confidence:
          type: number
          minimum: 0
          maximum: 1
      required: [speaker, startTime, endTime, originalText, translatedText, language, confidence]
    MeetingIntelligence:
      type: object
      properties:
        summary:
          type: string
        decisions:
          type: array
          items:
            $ref: "#/components/schemas/MeetingDecision"
        actionItems:
          type: array
          items:
            $ref: "#/components/schemas/MeetingActionItem"
        risks:
          type: array
          items:
            $ref: "#/components/schemas/MeetingRisk"
        questions:
          type: array
          items:
            $ref: "#/components/schemas/MeetingQuestion"
      required: [summary, decisions, actionItems, risks, questions]
    MeetingDecision:
      type: object
      properties:
        decision:
          type: string
        speaker:
          type: ["string", "null"]
        context:
          type: string
        confidence:
          type: number
          minimum: 0
          maximum: 1
      required: [decision, speaker, context, confidence]
    MeetingActionItem:
      type: object
      properties:
        action:
          type: string
        assignee:
          type: ["string", "null"]
        deadline:
          type: ["string", "null"]
        priority:
          type: string
          enum: [high, medium, low]
        confidence:
          type: number
          minimum: 0
          maximum: 1
      required: [action, assignee, deadline, priority, confidence]
    MeetingRisk:
      type: object
      properties:
        risk:
          type: string
        speaker:
          type: ["string", "null"]
        severity:
          type: string
          enum: [high, medium, low]
        confidence:
          type: number
          minimum: 0
          maximum: 1
      required: [risk, speaker, severity, confidence]
    MeetingQuestion:
      type: object
      properties:
        question:
          type: string
        speaker:
          type: ["string", "null"]
        answered:
          type: boolean
        answerSummary:
          type: ["string", "null"]
        confidence:
          type: number
          minimum: 0
          maximum: 1
      required: [question, speaker, answered, answerSummary, confidence]

